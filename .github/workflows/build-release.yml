# Build split-per-abi release APKs, publish GitHub Release, notify Telegram.
#
# The release APK is currently built with the app's existing debug signing
# config (see android/app/build.gradle -> buildTypes.release.signingConfig).
# When a real release keystore is ready, switch to it by:
#   1. Adding a signingConfigs.release block to android/app/build.gradle that
#      reads android/key.properties (storeFile/storePassword/keyPassword/keyAlias).
#   2. Adding a "Setup Android release signing" step here that decodes a
#      base64 keystore secret (e.g. ANDROID_KEYSTORE_BASE64) and writes
#      android/key.properties before the build step.
#
# Optional repo secrets (Telegram notifications are skipped if unset —
# the build and GitHub Release still run):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
name: Build & Release APKs

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  APK_DIR: build/app/outputs/flutter-apk
  TG_MAX_BYTES: 52428800
  TG_APP_NAME: Sakeenah
  TG_REF_NAME: ${{ github.ref_name }}
  TG_RUN_NUMBER: ${{ github.run_number }}
  TG_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Telegram helper
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          chmod +x .github/scripts/telegram_notify.sh
          echo "TG_SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Notify — pipeline started
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="workflow_dispatch by ${ACTOR}"
          fi
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG" | head -c 500 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          BODY="✍ <blockquote>${COMMIT_MSG}</blockquote>"
          .github/scripts/telegram_notify.sh started "Release pipeline started" "$BODY" 2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read FVM Flutter version
        id: fvm
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.fvmrc'))['flutter'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using Flutter ${VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Notify — Flutter ready
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          BODY="Flutter <code>${{ steps.fvm.outputs.version }}</code> ready
          Next: <code>flutter pub get</code>"
          .github/scripts/telegram_notify.sh progress "Environment ready" "$BODY" 15

      - name: Get packages
        run: flutter pub get

      - name: Notify — building APKs
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          BODY="Target: <code>--split-per-abi --release</code>
          ABIs: <code>armeabi-v7a</code> · <code>arm64-v8a</code> · <code>x86_64</code>"
          .github/scripts/telegram_notify.sh progress "Building release APKs" "$BODY" 35

      - name: Build release APKs
        run: flutter build apk --split-per-abi --release

      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          SAFE_VERSION=${VERSION//+/-}
          TAG="v${SAFE_VERSION}-build${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          for abi in armeabi-v7a arm64-v8a x86_64; do
            SRC="${APK_DIR}/app-${abi}-release.apk"
            DEST="dist/Sakeenah-${abi}-v${SAFE_VERSION}.apk"
            if [ ! -f "$SRC" ]; then
              echo "Missing APK: $SRC" >&2
              ls -la "${APK_DIR}" || true
              exit 1
            fi
            cp "$SRC" "$DEST"
            SIZE=$(stat -c '%s' "$DEST")
            SIZE_MB=$(awk "BEGIN {printf \"%.1f\", ${SIZE}/1048576}")
            echo "Prepared $DEST (${SIZE_MB} MB)"
          done
          ls -lh dist/

      - name: Notify — APKs built
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          BODY="Version: <code>${{ steps.assets.outputs.version }}</code>
          Tag: <code>${{ steps.assets.outputs.tag }}</code>
          3 ABI-split APKs prepared in <code>dist/</code>"
          .github/scripts/telegram_notify.sh progress "APKs built" "$BODY" 60

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ steps.assets.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Notify — publishing release
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          BODY="Tag: <code>${{ steps.assets.outputs.tag }}</code>
          Uploading 3 APKs to GitHub Releases…"
          .github/scripts/telegram_notify.sh progress "Publishing GitHub Release" "$BODY" 80

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          name: Release ${{ steps.assets.outputs.tag }}
          body: |
            ## Sakeenah — ${{ steps.assets.outputs.tag }}

            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Workflow:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### APKs (split per ABI)
            - `Sakeenah-armeabi-v7a-*.apk` — 32-bit ARM
            - `Sakeenah-arm64-v8a-*.apk` — 64-bit ARM (most phones)
            - `Sakeenah-x86_64-*.apk` — emulators / x86 devices
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Notify — release links + attach arm64-v8a APK (≤50 MB)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          TAG: ${{ steps.assets.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Telegram only gets arm64-v8a (most phones); other ABIs stay on GitHub Release
          apk=$(ls dist/*-arm64-v8a-*.apk | head -1)
          if [ ! -f "$apk" ]; then
            echo "Missing arm64-v8a APK in dist/" >&2
            ls -la dist/ || true
            exit 1
          fi

          NAME=$(basename "$apk")
          ASSET_URL="https://github.com/${REPO}/releases/download/${TAG}/${NAME}"
          SIZE=$(stat -c '%s' "$apk")
          SIZE_MB=$(awk "BEGIN {printf \"%.1f\", ${SIZE}/1048576}")

          BODY="Tag: <code>${TAG}</code>

          📥 <b>Telegram APK</b> (arm64-v8a only)
          • <a href=\"${ASSET_URL}\">${NAME}</a> · ${SIZE_MB} MB

          🔗 <a href=\"${RELEASE_URL}\">GitHub Release</a> — all ABIs"

          .github/scripts/telegram_notify.sh success "Release published" "$BODY" 100

          if [ "$SIZE" -gt "$TG_MAX_BYTES" ]; then
            BODY="File: <code>${NAME}</code>
            Size: <b>${SIZE_MB} MB</b> (over 50 MB bot limit)
            Use the download link from the message above."
            .github/scripts/telegram_notify.sh warning "APK not attached" "$BODY" 100
          else
            echo "Sending ${NAME} (${SIZE_MB} MB) to Telegram…"
            CAPTION=$(cat <<EOF
          📱 ${TG_APP_NAME}
          #${TG_RUN_NUMBER} · ${TG_REF_NAME} · ${TG_SHORT_SHA}
          ━━━━━━━━━━━━━━━━━━━━
          📦 ${NAME}
          ${SIZE_MB} MB · ${TAG}
          EOF
            )
            CAPTION=$(echo "$CAPTION" | sed 's/^[[:space:]]*//')
            curl -fsS --retry 3 --retry-delay 5 \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${apk}" \
              -F "caption=${CAPTION}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          fi

      - name: Notify — build failed
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          BODY="The pipeline stopped with an error.
          Check the workflow logs for details."
          .github/scripts/telegram_notify.sh failure "Build failed" "$BODY" || true
