name: Sakeenah
description: Sakeenah is a simple, reliable mobile app that combines accurate, location-based prayer times with a live Quran radio stream for daily use. Designed for tranquility and ease, it helps users check prayer times and listen to recitation in the background, all in a clean, trustworthy interface.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# Application version
version: 1.0.0+1

environment:
  sdk: ^3.10.0-0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  # cupertino_icons: 1.0.9
  # State management
  flutter_bloc: 9.1.1
  # A wrapper around InheritedWidget to make them easier to use and more reusable
  provider: 6.1.5+1
  # Compare objects
  equatable: 2.0.8
  # Service locator
  get_it: 9.2.1
  injectable: 2.7.1+4
  # Prints beautiful logs
  logger: 2.7.0
  # Functional programming in Dart
  dartz: 0.10.1
  # Shared preferences
  shared_preferences: 2.5.5
  #  Http client for Dart
  dio: 5.9.2
  # Pretty Dio logger is a Dio interceptor that logs network calls in a pretty, easy to read format
  pretty_dio_logger: 1.4.0
  # adapting screen and font size
  flutter_screenutil: 5.9.3
  # Simple widget wrapper to enable modal progress HUD
  modal_progress_hud_nsn: 0.5.1
  # Show native toast
  fluttertoast: 9.1.0
  # A Flutter plugin for finding commonly used locations on the filesystem.
  # Supports iOS, Android, Linux and MacOS. Not all methods are supported on all platforms.
  path_provider: 2.1.5
  # Google supported fonts
  google_fonts: 8.1.0
  # Code generation for immutable classes with simple syntax
  freezed_annotation: 3.1.0
  # Changing them with beautiful and easy way with animations
  animated_theme_switcher: 2.0.10
  # Draw SVG files on a Flutter Widget.
  flutter_svg: 2.3.0
  # A flutter library to show images from the internet and keep them in the cache directory.
  cached_network_image: 3.4.1
  # A Flutter plugin that provides a Google Maps widget.
  google_maps_flutter: 2.17.1
  # A Flutter geolocation plugin which provides easy access to platform specific location services.
  geolocator: 14.0.2
  # Use this library to request permissions and check their status
  permission_handler: 12.0.2
  # A library to get/listen on location changes in the background
  # background_location: 0.8.1
  # A flutter package which contains a collection of some cool and awesome text animations.
  animated_text_kit: 4.3.0
  # Show snack bars without context
  another_flushbar: 2.2.4
  # Flutter widget that automatically resizes text to fit perfectly within its bounds.
  auto_size_text: 3.0.0


  # A Flutter plugin for handling animations with a simple, powerful API.
  flutter_animate: 4.5.2
  # Checks for an actual internet connection (not just network attachment)
  internet_connection_checker_plus: 3.1.1
  # A Flutter plugin to show a beautiful loading widget.
  flutter_spinkit: 5.2.2
  # A Flutter plugin for storing and retrieving data from Hive.
  hive: 2.2.3
  # A Flutter plugin for storing and retrieving data from Hive.
  hive_flutter: 1.1.0
  # A Flutter plugin for geocoding and reverse geocoding.
  geocoding: 5.0.0
  # A Flutter plugin for showing a skeleton loading effect.
  skeletonizer: 2.1.3
  # Low-level audio engine for live radio streaming with preserved buffer + seek.
  flutter_soloud: 4.1.7
  # This plugin wraps around your existing audio code to allow it to run in the background and interact with the media notification, the lock screen, headset buttons, wearables and Android Auto. It supports Android, iOS, web and Linux (via audio_service_mpris). It is suitable for:
  # - Music and podcast apps
  # - Voice assistants
  # - Radio and streaming apps
  # - Audiobook players
  # - Any app requiring background audio and rich OS integration
  audio_service: 0.18.19
  # This plugin informs the operating system of the nature of your audio app (e.g. game, media player, assistant, etc.)
  # and how your app will handle and initiate audio interruptions (e.g. phone call interruptions).
  # It also provides access to all of the capabilities of AVAudioSession on iOS and AudioManager on Android, providing for discoverability and configuration of audio hardware.
  audio_session: 0.2.4
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  # A build system for Dart code generation and modular compilation
  build_runner: 2.5.4
  # Dependency injection code generator
  injectable_generator: 2.7.0
  # Freezed package code generator
  freezed: 3.1.0
  # Used in freezed package
  json_serializable: 6.9.5
  # For more health code
  flutter_lints: 6.0.0
  # Change native code splash
  flutter_native_splash: 2.4.8
  # Change App Package Name with single command.
  change_app_package_name: 1.5.0
  # A command-line tool which simplifies the task of updating your Flutter app's launcher icon.
  flutter_launcher_icons: 0.14.4
  # Custom lints
  core_lints:
    path: ./lib/core/library/core_lints

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/map_styles/
    - assets/images/png/
    - assets/images/png/error/
    - assets/images/svg/
    - assets/images/svg/icons/
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

# Enable intl translation and make name of it [Translation]
flutter_intl:
  enabled: true
  class_name: S
